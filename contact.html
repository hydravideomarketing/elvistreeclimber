<div class="hero page-hero"><h1>Get a <em>Free Quote</em></h1></div>

<section><div class="wrap">
  <h2>Contact Elvis</h2>
  <p class="lead">Phone: [add number] &nbsp;|&nbsp; Email: [add email] &nbsp;|&nbsp; Area: [add service area]</p>
  <!-- Replace the action with your form service (Formspree, Netlify Forms, etc.) -->
  <form action="#" method="post">
    <div><label for="name">Name</label><input id="name" name="name" required></div>
    <div><label for="email">Email</label><input id="email" name="email" type="email" required></div>
    <div><label for="phone">Phone</label><input id="phone" name="phone"></div>
    <div><label for="service">Service</label>
      <select id="service" name="service">
        <option>Tree Trimming</option><option>Tree Removal</option>
        <option>Storm Cleanup</option><option>Other</option>
      </select></div>
    <div><label for="msg">Tell us about your trees</label><textarea id="msg" name="message"></textarea></div>
    <button class="btn" type="submit">Send Request</button>
  </form>
</div></section>

<footer><p><strong>Elvis Tree Climber Extraordinaire</strong></p><p>&copy; 2026 All rights reserved.</p></footer>
